name: UI preview

on:
  push:
    branches: [main]
    paths: ['resources/**', 'app/**', 'database/**', 'routes/**', 'scripts/**', '.github/workflows/ui-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build

      - name: Prepare demo database
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder --force

      - name: Take screenshots
        run: |
          php artisan serve --port=8000 > /tmp/serve.log 2>&1 &
          sleep 3
          npm i --no-save playwright@1
          npx playwright install chromium
          node scripts/screenshots.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7

      - if: failure()
        run: tail -n 100 storage/logs/laravel.log || true
